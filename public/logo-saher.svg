<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saharGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C2185B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AD1457;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#saharGradient)" stroke-width="3" opacity="0.4"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="70" fill="url(#saharGradient)" opacity="0.1"/>
  
  <!-- Decorative Diamond Shape -->
  <g transform="translate(100, 100)">
    <path d="M 0 -50 L 35 -15 L 0 20 L -35 -15 Z" fill="url(#saharGradient)" opacity="0.3"/>
    <path d="M 0 -40 L 28 -12 L 0 16 L -28 -12 Z" fill="url(#saharGradient)" opacity="0.5"/>
    <path d="M 0 -30 L 21 -9 L 0 12 L -21 -9 Z" fill="url(#accentGradient)" opacity="0.8"/>
  </g>
  
  <!-- Center Star -->
  <g transform="translate(100, 100)">
    <path d="M 0 -18 L 4 -6 L 17 -6 L 7 3 L 11 15 L 0 8 L -11 15 L -7 3 L -17 -6 L -4 -6 Z" 
          fill="url(#accentGradient)"/>
  </g>
  
  <!-- Sparkles -->
  <circle cx="50" cy="50" r="4" fill="url(#accentGradient)" opacity="0.7"/>
  <circle cx="150" cy="50" r="3" fill="url(#saharGradient)" opacity="0.5"/>
  <circle cx="50" cy="150" r="3" fill="url(#saharGradient)" opacity="0.5"/>
  <circle cx="150" cy="150" r="4" fill="url(#accentGradient)" opacity="0.7"/>
  <circle cx="100" cy="25" r="3" fill="url(#saharGradient)" opacity="0.6"/>
  <circle cx="100" cy="175" r="3" fill="url(#saharGradient)" opacity="0.6"/>
  <circle cx="25" cy="100" r="3" fill="url(#saharGradient)" opacity="0.5"/>
  <circle cx="175" cy="100" r="3" fill="url(#saharGradient)" opacity="0.5"/>
  
  <!-- Logo Text: سحر -->
  <text x="100" y="160" font-family="Cairo, Arial, sans-serif" font-size="32" font-weight="bold" 
        text-anchor="middle" fill="url(#saharGradient)">سحر</text>
  
  <!-- Subtitle: SAHAR -->
  <text x="100" y="182" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"
        text-anchor="middle" fill="#AD1457" letter-spacing="4">SAHAR</text>
</svg>